site_name: bhoonidhi-mcp
site_description: >-
  An MCP server that lets an AI agent search ISRO's Bhoonidhi Earth-observation
  portal in plain language. Read-only, no login, built on the
  bhoonidhi-downloader SDK.
site_url: https://geovicco-dev.github.io/bhoonidhi-mcp/
repo_url: https://github.com/geovicco-dev/bhoonidhi-mcp
repo_name: geovicco-dev/bhoonidhi-mcp
edit_uri: edit/main/docs/

# The custom, reactive landing page is docs/index.html and is served verbatim as
# the site root. The pages below are the themed docs the landing page links into.
nav:
  - Home: index.html
  - Getting started: getting-started.md
  - Tools: tools.md
  - Changelog: CHANGELOG.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: deep orange
      accent: deep orange
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: deep orange
      accent: deep orange

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/geovicco-dev
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/bhoonidhi-mcp/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

copyright: |
  &copy; 2026 <a href="https://github.com/geovicco-dev" target="_blank" rel="noopener">Aditya Sharma</a> ·
  not affiliated with ISRO
