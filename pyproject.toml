[project]
name = "bhoonidhi-mcp"
version = "0.3.0"
description = "MCP server exposing ISRO's Bhoonidhi EO portal to AI agents, over the bhoonidhi-downloader SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aditya Sharma", email = "geovicco.dev@gmail.com" }
]
dependencies = [
    "bhoonidhi-downloader>=0.5.3,<0.6",
    "mcp>=2.0",
    "geopy>=2.4",
    "rapidfuzz>=3.0",
]

urls = { "Repository" = "https://github.com/geovicco-dev/bhoonidhi-mcp" }

[project.scripts]
bhoonidhi-mcp = "bhoonidhi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhoonidhi_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = [
    "B008",  # passing constructed defaults is an accepted MCP/typer idiom
]
